name: Tests

# Runs the full test complement on every commit to any branch and on every pull request, on Linux, Windows,
# and macOS for net8.0 and net10.0:
#   - the shared Touchstone suite through the console, xUnit, and NUnit runners (SQLite everywhere; on Linux
#     also PostgreSQL, MySQL, and SQL Server from docker/compose.test.yaml)
#   - the Native AOT test's checks under the JIT (reflection-based JSON is off in that project)
#   - the C#, JavaScript, and Python SDK harnesses against a running server
# and lints and builds the dashboard. The Native AOT binaries are published and run by native-aot.yml.

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / ${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        framework: [ net8.0, net10.0 ]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start PostgreSQL, MySQL, and SQL Server (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker compose -f docker/compose.test.yaml up -d --wait postgres mysql
          docker compose -f docker/compose.test.yaml up -d sqlserver
          docker compose -f docker/compose.test.yaml run --rm mssql-init
          {
            echo "CLUTCH_TEST_PROVIDERS=sqlite,postgresql,mysql,sqlserver"
            echo "CLUTCH_TEST_PG_PORT=5599"
            echo "CLUTCH_TEST_MYSQL_PORT=3399"
            echo "CLUTCH_TEST_MYSQL_USERNAME=root"
            echo "CLUTCH_TEST_MYSQL_PASSWORD=root"
            echo "CLUTCH_TEST_MSSQL_PORT=1499"
          } >> "$GITHUB_ENV"

      - name: Build
        id: build
        shell: bash
        run: |
          dotnet build src/Clutch.sln -c Release
          dotnet build sdk/csharp/Clutch.Sdk.sln -c Release

      - name: Touchstone console runner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/test-results
          dotnet run --project src/Test.Automated/Test.Automated.csproj -c Release -f ${{ matrix.framework }} --no-build -- --results artifacts/test-results/touchstone.json | tee artifacts/test-results/console.txt
          grep -Eq "^Total: [0-9]+ +Passed: [0-9]+ +Failed: 0 " artifacts/test-results/console.txt

      - name: xUnit adapter
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test src/Test.Xunit/Test.Xunit.csproj -c Release -f ${{ matrix.framework }} --no-build --logger "trx;LogFileName=xunit.trx" --results-directory artifacts/test-results

      - name: NUnit adapter
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test src/Test.Nunit/Test.Nunit.csproj -c Release -f ${{ matrix.framework }} --no-build --logger "trx;LogFileName=nunit.trx" --results-directory artifacts/test-results

      - name: Native AOT checks under the JIT
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project src/Test.Aot/Test.Aot.csproj -c Release -f ${{ matrix.framework }} --no-build

      - name: SDK harnesses (C#, JavaScript, Python)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/run-sdk-harnesses.sh ${{ matrix.framework }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts/test-results
          if-no-files-found: ignore

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
