# Clutch supported deployment: Postgres, two stateless server nodes, an nginx load
# balancer, the dashboard, and Prometheus + Grafana for observability.
#
# This file references published, tagged images only (jchristn77/clutch-server:v0.1.0
# and jchristn77/clutch-ui:v0.1.0) — it never builds from a local context. Build and
# push the images first with the root build scripts (Docker Build Cloud):
#   build-all.bat v0.1.0
#
# Then start the stack:
#   docker compose up -d
#
# API load balancer:  http://localhost:8080
# Dashboard:          http://localhost:3000
# Prometheus:         http://localhost:9090
# Grafana:            http://localhost:3001   (anonymous admin)

name: clutch

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clutch
    volumes:
      - clutch-pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clutch"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  clutch-node1:
    image: jchristn77/clutch-server:v0.1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CLUTCH_NODE_ID: clutch-node1
      CLUTCH_DB_HOST: postgres
      CLUTCH_DB_PORT: "5432"
      CLUTCH_DB_DATABASE: clutch
      CLUTCH_DB_USERNAME: postgres
      CLUTCH_DB_PASSWORD: postgres
      CLUTCH_AUTH_SIGNING_KEY: change-me-in-production
    volumes:
      - ./server/clutch.node1.json:/app/clutch.json
    restart: unless-stopped

  clutch-node2:
    image: jchristn77/clutch-server:v0.1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CLUTCH_NODE_ID: clutch-node2
      CLUTCH_DB_HOST: postgres
      CLUTCH_DB_PORT: "5432"
      CLUTCH_DB_DATABASE: clutch
      CLUTCH_DB_USERNAME: postgres
      CLUTCH_DB_PASSWORD: postgres
      CLUTCH_AUTH_SIGNING_KEY: change-me-in-production
    volumes:
      - ./server/clutch.node2.json:/app/clutch.json
    restart: unless-stopped

  clutch-nginx:
    image: nginx:alpine
    depends_on:
      - clutch-node1
      - clutch-node2
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  clutch-dashboard:
    image: jchristn77/clutch-ui:v0.1.0
    depends_on:
      - clutch-nginx
    ports:
      - "3000:80"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - otel-collector
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - clutch-prometheus:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - clutch-grafana:/var/lib/grafana
    restart: unless-stopped

volumes:
  clutch-pgdata:
  clutch-prometheus:
  clutch-grafana:
