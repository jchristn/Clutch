# nginx load balancer fronting the two Clutch server nodes. Balances REST and
# WebSocket traffic. ip_hash gives each client connection affinity to a node, which
# keeps long-lived WebSocket connections stable; correctness does not depend on it
# because Postgres is the authority for lock state.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream clutch_backend {
        ip_hash;
        server clutch-node1:8080;
        server clutch-node2:8080;
    }

    server {
        listen 8080;
        server_name _;

        # Buffering off so streaming and WebSocket frames pass through promptly.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location / {
            proxy_pass http://clutch_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade support for /v1.0/lock/connect.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
